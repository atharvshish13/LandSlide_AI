plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def releaseSigningProperties = [
    storeFile: providers.environmentVariable("ANDROID_KEYSTORE_FILE").orNull,
    storePassword: providers.environmentVariable("ANDROID_KEYSTORE_PASSWORD").orNull,
    keyAlias: providers.environmentVariable("ANDROID_KEY_ALIAS").orNull,
    keyPassword: providers.environmentVariable("ANDROID_KEY_PASSWORD").orNull
]
def configuredReleaseSigningProperties = releaseSigningProperties.values().findAll {
    it != null && !it.isBlank()
}
def releaseSigningConfigured = configuredReleaseSigningProperties.size() == releaseSigningProperties.size()
if (!configuredReleaseSigningProperties.isEmpty() && !releaseSigningConfigured) {
    throw new GradleException("Release signing requires ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.")
}
def verifyReleaseSigning = tasks.register("verifyReleaseSigning") {
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException("Release packaging requires the registered upload key. Set ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.")
        }
    }
}
tasks.configureEach {
    if (name == "packageRelease" || name == "packageReleaseBundle") {
        dependsOn(verifyReleaseSigning)
    }
}

configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

tasks.register("prepareEmbeddedPython", Sync) {
    from("../../backend") {
        into("backend")
        include("**/*.py")
        exclude("tests/**")
    }
    from("../../database") {
        into("database")
        include("**/*.py")
    }
    from("../../model") {
        into("model")
        include("**/*.py")
    }
    into(layout.buildDirectory.dir("generated/chaquopy/python"))
}

tasks.named("preBuild").configure {
    dependsOn("prepareEmbeddedPython")
}
tasks.matching { it.name.endsWith("PythonSources") }.configureEach {
    dependsOn("prepareEmbeddedPython")
}

android {
    namespace 'com.geoguard.landslide'
    compileSdk 34

    defaultConfig {
        applicationId "com.geoguard.landslide"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.6"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
        }
    }

    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(releaseSigningProperties.storeFile)
                storePassword releaseSigningProperties.storePassword
                keyAlias releaseSigningProperties.keyAlias
                keyPassword releaseSigningProperties.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.10"
        pip {
            install("flask")
            install("flask-cors")
            install("requests")
            install("sqlalchemy")
        }
    }
    sourceSets {
        main {
            srcDir(layout.buildDirectory.dir("generated/chaquopy/python"))
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
